[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-llm-calibration"
version = "0.1.0"
description = "Turn-level calibration experiments for clinical dialogue agents"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["calibration_collapse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
