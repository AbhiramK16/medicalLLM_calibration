# Shared experiment configuration.
experiment_name: calibration-collapse
case_count: 100
case_ids: []

dataset:
  name: agentclinic-medqa

backbones:
  - label: standard_instruction
    model: openai/gpt-4o-mini
  - label: reasoning
    model: openai/o4-mini

conditions:
  - sequential
  - randomized_order
  - static

turns:
  dialogue: 6
  static: 1
  bins:
    method: proportional_dialogue_thirds
    early_max_fraction: 0.3333333333333333
    middle_max_fraction: 0.6666666666666666
    six_turn_mapping:
      early: [1, 2]
      middle: [3, 4]
      late: [5, 6]
    static_label: static

seeds:
  - 0

confidence:
  minimum: 0
  maximum: 100

output:
  directory: results/raw_outputs
  turn_file: turns.jsonl
  schema_version: 1
